name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Quét key, token bị lộ (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Kiểu (core, web, mobile)
        run: pnpm typecheck
      - name: Test nghiệp vụ (vitest)
        run: pnpm test
      - name: Migration, seed, RLS trên Postgres 16
        run: |
          sudo apt-get install -y --no-install-recommends postgresql-16 postgresql-contrib-16 >/dev/null || true
          pnpm db:seed:gen && git diff --exit-code supabase/seed.sql
          sudo -E bash supabase/tests/run-local.sh
      - name: Build web
        run: pnpm build:web
